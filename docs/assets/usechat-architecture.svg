<text x="500" y="1275" font-size="21" fill="#4d6b84" font-weight="400" text-anchor="middle">虚线：模型请求与响应；模型服务可为远程端点</text>
<text x="500" y="1310" font-size="20" fill="#4d6b84" font-weight="400" text-anchor="middle">watch 是可见窗口轮询；发送切换对话时也可能识别布局</text>
