<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
<title id="title">UseChat: WeChat through an Agent Skill</title>
<desc id="desc">The user specifies a chat and message. The Agent loads wechat-visual, inspects screenshots, and calls local Node.js primitives. macOS tools operate WeChat. Fresh screenshots and pixel guards protect each input; the Agent visually verifies the result.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526680"/></marker></defs>
<rect width="1400" height="980" fill="#f5f7fb"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172c48}.title{font-size:44px;font-weight:700}.sub{font-size:21px;fill:#536983}.label{font-size:15px;font-weight:700;letter-spacing:2px;fill:#536983}.head{font-size:25px;font-weight:700}.body{font-size:19px;fill:#435a76}.small{font-size:17px;fill:#536983}.line{fill:none;stroke:#526680;stroke-width:3;marker-end:url(#arrow)}</style>

<text x="60" y="80" class="title">UseChat</text>
<text x="60" y="120" class="sub">A screenshot-first WeChat Skill for your existing AI Agent</text>
<text x="60" y="178" class="label">INTENT</text>
<text x="390" y="178" class="label">REASONING</text>
<text x="720" y="178" class="label">LOCAL EXECUTION</text>
<text x="1050" y="178" class="label">VISIBLE APP</text>
<rect x="60" y="205" width="280" height="280" rx="18" fill="#ffffff" stroke="#d9e2ee" stroke-width="2"/>
<rect x="390" y="205" width="280" height="280" rx="18" fill="#eaf1ff" stroke="#d9e2ee" stroke-width="2"/>
<rect x="720" y="205" width="280" height="280" rx="18" fill="#ffffff" stroke="#d9e2ee" stroke-width="2"/>
<rect x="1050" y="205" width="290" height="280" rx="18" fill="#e9f7ee" stroke="#d9e2ee" stroke-width="2"/>
<text x="82" y="250" class="head">User</text>
<text x="82" y="302" class="body">Choose the chat</text>
<text x="82" y="339" class="body">Specify the message</text>
<text x="82" y="376" class="body">Authorize shared input</text>
<text x="82" y="451" class="small">“Send hello to my group”</text>
<text x="412" y="250" class="head">Agent + Skill</text>
<text x="412" y="302" class="body">Load wechat-visual</text>
<text x="412" y="339" class="body">Inspect the actual PNG</text>
<text x="412" y="376" class="body">Choose the next action</text>
<text x="412" y="451" class="small">Uses the host’s AI model</text>
<text x="742" y="250" class="head">Node.js tools</text>
<text x="742" y="302" class="body">shot / read / scroll</text>
<text x="742" y="339" class="body">click / type / key</text>
<text x="742" y="376" class="body">Return image + receipt</text>
<text x="742" y="451" class="small">No separate model API</text>
<text x="1072" y="250" class="head">macOS WeChat</text>
<text x="1072" y="302" class="body">FFmpeg captures pixels</text>
<text x="1072" y="339" class="body">cliclick / JXA send input</text>
<text x="1072" y="376" class="body">Shared foreground desktop</text>
<text x="1072" y="451" class="small">No native Helper build</text>
<path d="M 345 345 H 382" class="line"/>
<path d="M 675 345 H 712" class="line"/>
<path d="M 1005 345 H 1042" class="line"/>
<path d="M 1195 489 V 547 H 530 V 492" class="line"/>
<text x="655" y="580" class="sub">New screenshot → Agent checks the visible result</text>
<rect x="60" y="625" width="1280" height="242" rx="18" fill="#ffffff" stroke="#d9e2ee" stroke-width="2"/>
<text x="88" y="668" class="label">BEFORE EVERY INPUT</text>
<text x="88" y="715" class="head">1. Capture</text>
<text x="88" y="759" class="small">One frame → crop to WeChat</text>
<text x="88" y="791" class="small">Window metadata; no UI tree</text>
<text x="510" y="715" class="head">2. Guard</text>
<text x="510" y="759" class="small">Fresh pixels + title / draft checks</text>
<text x="510" y="791" class="small">Single-use receipt; stop on change</text>
<text x="930" y="715" class="head">3. Act &amp; inspect</text>
<text x="930" y="759" class="small">Type and Return are separate</text>
<text x="930" y="791" class="small">Check bubble / text / errors</text>
<text x="60" y="914" class="small">Local scripts do not call a model API. Screenshot processing follows the Agent host’s data settings.</text>
<text x="60" y="945" class="small">macOS only · Node.js 20+ · FFmpeg + cliclick · No OCR, chat database, injection or message listener</text>
</svg>